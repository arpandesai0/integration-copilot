services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: integration_copilot
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d integration_copilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
